[package]
name = "launcher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Núcleo do Aurora Launcher: autenticação, downloads, resolução de versões, Java e execução da JVM"

[dependencies]
tokio = { version = "1", features = ["fs", "io-util", "process", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
dirs = "6"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
urlencoding = "2"
base64 = "0.22"
toml = { version = "0.8", default-features = false, features = ["parse"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
