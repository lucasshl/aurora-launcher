[package]
name = "cosmetics-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Servidor de skins/capas compatível com CustomSkinAPI para o Aurora Launcher"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "signal"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
